​<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compliment vs Roast Roulette</title>
    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #845ec2, #d65db1, #ff6f91, #ff9671, #ffc75f);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #fff;
        }
        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .container {
            background: rgba(0, 0, 0, 0.8);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
            width: 90%;
            max-width: 500px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
        }
        h1 {
            font-size: 2em;
            margin-bottom: 20px;
            text-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }
        input[type="text"] {
            width: 80%;
            padding: 15px;
            margin-bottom: 20px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            text-align: center;
            outline: none;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.2);
        }
        button {
            padding: 15px 40px;
            background: linear-gradient(90deg, #ff007f, #7928ca);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }
        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(255,0,127,0.4);
        }
        button:active {
            transform: translateY(1px);
        }
        .results-area {
            margin-top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .box {
            padding: 20px;
            border-radius: 20px;
            font-size: 1.2em;
            font-weight: 600;
            opacity: 0;
            transform: scale(0.9);
            transition: opacity 0.5s, transform 0.5s;
        }
        .compliment {
            background: linear-gradient(135deg, #00b09b, #96c93d);
            color: #000;
            box-shadow: 0 10px 20px rgba(0,176,155,0.3);
        }
        .roast {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            color: #fff;
            box-shadow: 0 10px 20px rgba(255,65,108,0.3);
        }
        .show {
            opacity: 1;
            transform: scale(1);
        }
        .social-link {
            margin-top: 30px;
            display: inline-block;
            font-size: 0.9em;
            color: #aaa;
            text-decoration: none;
            transition: color 0.3s;
        }
        .social-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>✨ Roast & Toast ✨</h1>
        <input type="text" id="userName" placeholder="Enter your name..." maxlength="15">
        <br>
        <button onclick="spinRoulette()">Spin the Wheel</button>

        <div class="results-area">
            <div id="compBox" class="box compliment"></div>
            <div id="roastBox" class="box roast"></div>
        </div>

        <br>
        <a href="https://instagram.com" class="social-link" target="https://www.instagram.com/dev.deka_?fqnt=MWs2eGZpcnB0NWxhaQ==">Built for fun | Follow my journey</a>
    </div>

    <script>
        const compliments = [
            "Your smile could probably end wars.",
            "You are the human equivalent of a warm cup of coffee on a rainy day.",
            "Your brain works faster than a quantum computer when it comes to making excuses.",
            "You have the kind of charisma that makes people want to be your sidekick.",
            "You're not just a snack, you're the entire damn buffet."
        ];

        const roasts = [
            "You’re the reason shampoo has instructions.",
            "I’d agree with you, but then we’d both be wrong.",
            "You bring everyone so much joy... when you leave the room.",
            "Your personality is like a software update: everyone clicks 'remind me later'.",
            "You have an entire library of arguments in your head that you lost three years ago."
        ];

        function spinRoulette() {
            const name = document.getElementById('userName').value.trim();
            if(!name) {
                alert("Don't be shy, enter your name!");
                return;
            }

            const compBox = document.getElementById('compBox');
            const roastBox = document.getElementById('roastBox');

            compBox.classList.remove('show');
            roastBox.classList.remove('show');

            setTimeout(() => {
                const randomComp = compliments[Math.floor(Math.random() * compliments.length)];
                const randomRoast = roasts[Math.floor(Math.random() * roasts.length)];

                compBox.innerText = `🌟 ${name}, ${randomComp}`;
                roastBox.innerText = `🔥 Oh yeah? Well, ${randomRoast.toLowerCase()}`;

                compBox.classList.add('show');
                setTimeout(() => {
                    roastBox.classList.add('show');
                }, 200);
            }, 300);
        }
    </script>

</body>
</html>
